name: Build signed packages for review

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact stable-version commit already merged into main
        required: true
        type: string
      candidate_run:
        description: Successful six-job Verify run for that commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      GODEBUG: http2client=0
    steps:
      - name: Require a verified commit from main before accessing signing credentials
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          head=os.environ['CANDIDATE_SHA'];run=os.environ['CANDIDATE_RUN'];repo='MoChiUaena/tech-resume-kit'
          assert re.fullmatch(r'[0-9a-f]{40}',head) and run.isdigit()
          api=lambda url:json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+url]))
          state=api('actions/runs/'+run)
          assert state['head_sha']==head and state['status']=='completed' and state['conclusion']=='success'
          assert state['path']=='.github/workflows/verify.yml' and state['head_repository']['full_name'].lower()==repo.lower()
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert len(jobs)==6 and all(job['conclusion']=='success' for job in jobs)
          assert api('compare/'+head+'...main')['status'] in {'ahead','identical'}
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Require a stable package version
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',json.load(open('package.json'))['version'])
          assert all(Path(file).is_file() for file in ['scripts/sign-windows.ps1','scripts/package-macos-app.py','scripts/macos_signing.py','desktop/MacLauncher.swift'])
          PY

  windows:
    needs: candidate
    environment: release-signing
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      TECH_RESUME_WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
      TECH_RESUME_WIN_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGN_CERT_THUMBPRINT }}
      TECH_RESUME_WINDOWS_SIGNING: required
    steps:
      - name: Require Windows credentials before building
        shell: python
        run: |
          import base64,os,pathlib
          for key in ['CERT_BASE64','TECH_RESUME_WIN_CERT_PASSWORD','TECH_RESUME_WIN_CERT_THUMBPRINT']:
              if not os.environ.get(key): raise SystemExit('Missing Windows signing setting: '+key)
          cert=pathlib.Path(os.environ['RUNNER_TEMP'])/'tech-resume-signing.pfx'
          cert.write_bytes(base64.b64decode(os.environ['CERT_BASE64'],validate=True))
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('TECH_RESUME_WIN_CERT_PATH='+str(cert)+'\n')
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and run the signed Windows package
        run: |
          npm ci
          npx playwright install chromium --only-shell
          npm run package:release
          npm run package:windows
          npm run test:windows
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-windows-validation
          compression-level: 0
          retention-days: 7
          path: |
            tmp/packages/tech-resume-windows-x64-*.zip
            tmp/packages/windows-smoke.json
      - name: Remove temporary certificate file
        if: always()
        shell: python
        run: |
          import os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'tech-resume-signing.pfx').unlink(missing_ok=True)

  macos:
    needs: candidate
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CERT_BASE64: ${{ secrets.MAC_SIGN_CERT_BASE64 }}
      KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      TECH_RESUME_MAC_CERT_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
      TECH_RESUME_MAC_CERT_SHA1: ${{ vars.MAC_SIGN_CERT_SHA1 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      TECH_RESUME_MAC_APP_MODE: notarized
    steps:
      - name: Require Apple signing and notarization settings before building
        shell: python
        run: |
          import base64,os,pathlib
          names=['CERT_BASE64','KEY_BASE64','TECH_RESUME_MAC_CERT_PASSWORD','TECH_RESUME_MAC_CERT_SHA1','APPLE_TEAM_ID','APPLE_API_KEY_ID','APPLE_API_ISSUER_ID']
          for key in names:
              if not os.environ.get(key): raise SystemExit('Missing Apple signing setting: '+key)
          for data,file,key in [('CERT_BASE64','tech-resume-signing.p12','TECH_RESUME_MAC_CERT_PATH'),('KEY_BASE64','tech-resume-api.p8','APPLE_API_KEY_PATH')]:
              target=pathlib.Path(os.environ['RUNNER_TEMP'])/file;target.write_bytes(base64.b64decode(os.environ[data],validate=True));target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as output: output.write(key+'='+str(target)+'\n')
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build, notarize and run the macOS app
        run: |
          npm ci
          npx playwright install chromium --only-shell
          npm run package:release
          npm run package:posix
          npm run package:macos-app -- --mode notarized
          npm run test:macos-app
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: notarized-macos-${{ matrix.arch }}-validation
          compression-level: 0
          retention-days: 7
          path: |
            tmp/packages/tech-resume-macos-app-${{ matrix.arch }}-*.zip
            tmp/packages/tech-resume-macos-app-${{ matrix.arch }}-*.json
            tmp/packages/tech-resume-macos-app-${{ matrix.arch }}-*.sha256
      - name: Remove temporary certificate and API key files
        if: always()
        shell: python
        run: |
          import os,pathlib
          for name in ['tech-resume-signing.p12','tech-resume-api.p8']:
              (pathlib.Path(os.environ['RUNNER_TEMP'])/name).unlink(missing_ok=True)
