name: Verify anonymous resume samples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit tracked files
        run: |
          python scripts/audit-public-files.py
          python scripts/test-macos-bundle.py
          python scripts/test-release-proofs.py
          python scripts/test-qa-report.py
      - name: Install locked Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install PDF verification tools
        run: |
          python -m pip install -r requirements-qa.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Test the input and export workflow
        run: |
          mkdir -p tmp
          npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=tmp/source-tests.xml
          python scripts/collect-test-report.py
      - name: Package and install outside the source checkout
        run: |
          npm run package:release
          npm run test:package
          python scripts/verify-pdf.py --directory tmp/pdfs/install
          python scripts/render-pdfs.py --directory tmp/pdfs/install
          python scripts/verify-pdf.py --directory tmp/pdfs/library
          python scripts/render-pdfs.py --directory tmp/pdfs/library
          python scripts/verify-pdf.py --directory tmp/pdfs/library-management
          python scripts/render-pdfs.py --directory tmp/pdfs/library-management
          python scripts/verify-pdf.py --directory tmp/pdfs/editing
          python scripts/render-pdfs.py --directory tmp/pdfs/editing
          python scripts/verify-pdf.py --directory tmp/pdfs/storage
          python scripts/render-pdfs.py --directory tmp/pdfs/storage
          python scripts/verify-pdf.py --directory tmp/pdfs/workbench
          python scripts/render-pdfs.py --directory tmp/pdfs/workbench
          python scripts/verify-pdf.py --directory tmp/pdfs/content-forms
          python scripts/render-pdfs.py --directory tmp/pdfs/content-forms
          python scripts/verify-pdf.py --directory tmp/pdfs/getting-started
          python scripts/render-pdfs.py --directory tmp/pdfs/getting-started
          python scripts/verify-pdf.py --directory tmp/pdfs/starter-templates
          python scripts/render-pdfs.py --directory tmp/pdfs/starter-templates
          python scripts/verify-pdf.py --directory tmp/pdfs/themes
          python scripts/render-pdfs.py --directory tmp/pdfs/themes --dpi 110
          python scripts/verify-pdf.py --directory tmp/pdfs/contact-links
          python scripts/render-pdfs.py --directory tmp/pdfs/contact-links
          python scripts/verify-pdf.py --directory tmp/pdfs/section-order
          python scripts/render-pdfs.py --directory tmp/pdfs/section-order
          python scripts/verify-pdf.py --directory tmp/pdfs/frontmatter-save
          python scripts/render-pdfs.py --directory tmp/pdfs/frontmatter-save
          python scripts/verify-pdf.py --directory tmp/pdfs/layout-options
          python scripts/render-pdfs.py --directory tmp/pdfs/layout-options --dpi 110
      - name: Build and check only anonymous samples
        run: |
          npm run sample
          python scripts/verify-pdf.py
          python scripts/render-pdfs.py
          npm run qa:boundaries
          python scripts/verify-pdf.py --directory tmp/pdfs/boundary
          python scripts/render-pdfs.py --directory tmp/pdfs/boundary --dpi 110
          python scripts/collect-qa-report.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-source-validation
          retention-days: 7
          path: |
            tmp/packages/tech-resume-kit-*.tgz
            tmp/packages/tech-resume-starter-*.zip
            output/pdf/
            assets/images/nailong-avatar.jpg
            docs/phase-c-evidence.json
            tmp/source-tests.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: workbench-conversion-validation
          retention-days: 7
          path: tmp/pdfs/workbench/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: content-form-validation
          retention-days: 7
          path: tmp/pdfs/content-forms/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: getting-started-validation
          retention-days: 7
          path: tmp/pdfs/getting-started/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starter-templates-validation
          if-no-files-found: error
          path: tmp/pdfs/starter-templates/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: resume-themes-validation
          if-no-files-found: error
          path: tmp/pdfs/themes/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: full-theme-preview-validation
          if-no-files-found: error
          path: tmp/ui/full-theme-preview/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: advanced-layout-validation
          retention-days: 7
          if-no-files-found: error
          path: |
            tmp/pdfs/layout-options/
            tmp/ui/layout-options/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: contact-link-validation
          retention-days: 7
          path: tmp/pdfs/contact-links/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: section-order-validation
          retention-days: 7
          path: tmp/pdfs/section-order/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: save-recovery-validation
          retention-days: 7
          path: |
            tmp/ui/save-recovery/
            tmp/ui/draft-backup/
            tmp/ui/automatic-drafts/
            tmp/ui/error-guidance/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontmatter-save-validation
          retention-days: 7
          path: tmp/pdfs/frontmatter-save/
  windows-download:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and run the Windows portable download
        run: |
          npm ci
          npx playwright install chromium --only-shell
          npm run package:release
          npm run package:windows
          npm run test:windows
          npm run test:journey
      - name: Download the published upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GODEBUG: http2client=0
        run: |
          $baseline = Get-Content scripts/upgrade-baseline.json -Raw | ConvertFrom-Json
          gh release download "v$($baseline.version)" --repo MoChiUaena/tech-resume-kit --pattern $baseline.archive --dir "tmp/upgrade-baselines/v$($baseline.version)"
      - name: Verify published-version upgrade and reopening the old program
        run: |
          npm run test:upgrade
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          python scripts/check-release-proofs.py --version $version
          python -m pip install -r requirements-qa.txt
          python scripts/verify-pdf.py --directory tmp/pdfs/upgrade
          python scripts/verify-pdf.py --directory tmp/pdfs/user-journey
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-portable-validation
          compression-level: 0
          retention-days: 7
          path: |
            tmp/packages/tech-resume-windows-x64-*.zip
            tmp/packages/windows-smoke.json
            tmp/packages/upgrade-smoke.json
            tmp/packages/user-journey-smoke.json
            tmp/pdfs/user-journey/
            tmp/pdfs/upgrade/
  posix-download:
    name: Portable ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            label: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            label: linux-arm64
          - runner: macos-15-intel
            arch: x64
            label: macos-x64
          - runner: macos-15
            arch: arm64
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare native browser and PDF verification
        shell: bash
        run: |
          node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture')"
          npm ci
          if [ '${{ runner.os }}' = 'Linux' ]; then
            npx playwright install --with-deps chromium --only-shell
            sudo apt-get install -y poppler-utils
          else
            npx playwright install chromium --only-shell
            brew install poppler
          fi
          python -m pip install -r requirements-qa.txt
      - name: Build and launch the native portable package
        run: |
          npm run package:release
          npm run package:posix
          npm run test:posix
          python scripts/verify-pdf.py --directory tmp/pdfs/portable
          python scripts/render-pdfs.py --directory tmp/pdfs/portable
      - name: Build and verify the native macOS app
        if: runner.os == 'macOS'
        run: |
          npm run package:macos-app
          npm run test:macos-app
          python scripts/check-release-proofs.py --version $(node -p "require('./package.json').version") --arch ${{ matrix.arch }}
          python scripts/verify-pdf.py --directory tmp/pdfs/macos-app
          python scripts/render-pdfs.py --directory tmp/pdfs/macos-app
      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'macOS'
        with:
          name: macos-app-${{ matrix.arch }}-validation
          compression-level: 0
          retention-days: 7
          path: |
            tmp/packages/tech-resume-macos-app-${{ matrix.arch }}-*
            tmp/pdfs/macos-app/
      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'macOS'
        with:
          name: macos-app-evidence-${{ matrix.arch }}
          retention-days: 7
          path: tmp/pdfs/macos-app/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-${{ matrix.label }}
          compression-level: 0
          retention-days: 7
          path: |
            tmp/packages/tech-resume-${{ matrix.label }}-*.tar.gz
            tmp/packages/${{ matrix.label }}-SHA256SUMS.txt
            tmp/packages/${{ matrix.label }}-smoke.json
            tmp/pdfs/portable/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-evidence-${{ matrix.label }}
          retention-days: 7
          path: |
            tmp/packages/${{ matrix.label }}-smoke.json
            tmp/pdfs/portable/
