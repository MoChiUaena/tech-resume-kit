name: Stage verified release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      candidate_sha:
        description: Exact commit that passed all six Verify jobs
        required: true
        type: string
      candidate_run:
        description: Successful Verify workflow run ID
        required: true
        type: string
      topic:
        description: Short functional theme used after the version in the release title
        required: true
        type: string
      notes:
        description: Concrete release notes for the verified candidate
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: stage-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      RELEASE_TOPIC: ${{ inputs.topic }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify candidate before downloading its files
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          version=os.environ['RELEASE_VERSION']; head=os.environ['CANDIDATE_SHA']; run=os.environ['CANDIDATE_RUN']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version)
          topic=os.environ['RELEASE_TOPIC'];notes=os.environ['RELEASE_NOTES']
          assert topic.strip()==topic and 1<=len(topic)<=60 and not any(ord(c)<32 for c in topic)
          assert notes.strip()
          assert re.fullmatch(r'[0-9a-f]{40}',head) and run.isdigit()
          state=json.loads(subprocess.check_output(['gh','run','view',run,'--repo','MoChiUaena/tech-resume-kit','--json','status,conclusion,headSha,jobs']))
          assert state['headSha']==head and state['status']=='completed' and state['conclusion']=='success'
          assert len(state['jobs'])==6 and all(job['conclusion']=='success' for job in state['jobs'])
          folder=Path('tmp')/('release-v'+version);folder.mkdir(parents=True)
          (folder/'ci.json').write_text(json.dumps(state))
          PY
      - name: Download the exact verified build outputs
        run: |
          gh run download "$CANDIDATE_RUN" --repo MoChiUaena/tech-resume-kit --name release-source-validation --dir "tmp/release-v$RELEASE_VERSION/artifacts/source"
          gh run download "$CANDIDATE_RUN" --repo MoChiUaena/tech-resume-kit --name windows-portable-validation --dir "tmp/release-v$RELEASE_VERSION/artifacts/windows"
          for label in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            gh run download "$CANDIDATE_RUN" --repo MoChiUaena/tech-resume-kit --name "portable-$label" --dir "tmp/release-v$RELEASE_VERSION/artifacts/$label"
          done
          for arch in x64 arm64; do
            gh run download "$CANDIDATE_RUN" --repo MoChiUaena/tech-resume-kit --name "macos-app-$arch-validation" --dir "tmp/release-v$RELEASE_VERSION/artifacts/macos-app-$arch"
          done
      - name: Inspect versions, executable modes and runtime hashes
        run: |
          python -m pip install -r requirements-qa.txt
          python scripts/stage-release.py
      - name: Upload checked files into a draft only
        run: python scripts/publish-release-draft.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: staged-release-metadata
          retention-days: 7
          path: |
            tmp/release-v*/assets/release-validation.json
            tmp/release-v*/assets/SHA256SUMS.txt
