<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历 PDF 预览</title><link rel="stylesheet" href="/pdfjs/pdf_viewer.css"><link rel="stylesheet" href="/pdf-viewer.css"><script type="module" src="/pdf-viewer.mjs"></script></head>
<body><header class="viewer-toolbar" aria-label="PDF 阅读工具"><button id="page-prev" aria-label="上一页" disabled>‹</button><span id="page-number" role="status">正在加载</span><button id="page-next" aria-label="下一页" disabled>›</button><label for="zoom">缩放</label><select id="zoom" aria-label="PDF 缩放" disabled><option value="fit">适合宽度</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><a id="open-pdf" target="_blank" rel="noopener noreferrer" hidden>打开 PDF</a></header><main id="pages" tabindex="0" aria-label="PDF 页面"><p id="loading" role="status">正在显示 PDF…</p><section id="viewer-error" role="alert" hidden><p id="error-message"></p><button id="retry">重新显示</button></section><div id="page-list"></div></main></body></html>
